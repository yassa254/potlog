<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AirPulse // Hotspot Error</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="single-page-body">
  <main class="single-page-main">
    <div class="portal-blueprint-container">
      <div class="dashed-section-primitive" style="text-align:center;padding:clamp(24px, 5vh, 40px) clamp(12px, 3vw, 24px);">
        <div class="hotspot-error-banner" style="display:block;margin-bottom:16px;word-break:break-word;">
          <strong>[HOTSPOT ERROR]</strong> $(error)
        </div>
        <h1 class="blueprint-display-headline" style="font-size:clamp(22px, 6vw, 32px);">AUTHENTICATION NOTICE.</h1>
        <p class="blueprint-subtext">The router gateway could not complete that request. Please return to the login page and try again.</p>
        <a class="btn-submit-blueprint" href="$(link-login)" style="display:inline-flex;margin-top:16px;text-decoration:none;min-height:44px;align-items:center;justify-content:center;padding:0 24px;">
          <span>Back to Hotspot Login</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
